<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title><span class="ye-ole">Ye Ole</span> Creative Brief Compiler</title>
<link rel="stylesheet" href="sparklight-brief-compiler.css" />
</head>

<body>
<div class="page">

  <header class="site-header" aria-label="Sparklight header">
    <img class="sparklight-logo" src="sparklight-logo-purple.png" alt="Sparklight">
  </header>

  <section class="hero">
    <img class="hero-lockup-img" src="assets/spark-cb-hero-lockup.png" alt="Ye Ole Creative Brief Compiler">
  </section>

  <main class="form-card">
    

    <form id="briefForm">

      <section class="form-section">
        <h3 class="section-title">Project Details</h3>
        <div class="grid">
          <div class="field full">
            <label for="projectName">Project Name *</label>
            <input id="projectName" name="Project Name" required placeholder="Enter project name">
          </div>

          <div class="field">
            <label for="firstName">Requestor’s First Name *</label>
            <input id="firstName" name="Requestor First Name" required placeholder="First name">
          </div>

          <div class="field">
            <label for="lastName">Requestor’s Last Name *</label>
            <input id="lastName" name="Requestor Last Name" required placeholder="Last name">
          </div>

          <div class="field">
            <label for="timeline">Campaign Timeline</label>
            <input id="timeline" name="Campaign Timeline" placeholder="Example: Q3, evergreen, launch window">
          </div>

          <div class="field">
            <label for="launchDate">Due / Launch Date</label>
            <input id="launchDate" name="Due / Launch Date" type="date">
          </div>

          <div class="field">
            <label for="strategyLead">Strategy Lead</label>
            <input id="strategyLead" name="Strategy Lead" placeholder="Name">
          </div>

          <div class="field">
            <label for="agency">Creative Agency</label>
            <input id="agency" name="Creative Agency" placeholder="Agency or internal team">
          </div>
        </div>
      </section>

      <section class="form-section">
        <h3 class="section-title">Strategy</h3>
        <div class="grid">
          <div class="field full">
            <label for="background">Background</label>
            <textarea id="background" name="Background" placeholder="Why is this campaign needed?"></textarea>
          </div>

          <div class="field full">
            <label for="smp">Single-Minded Proposition</label>
            <textarea id="smp" name="Single-Minded Proposition" placeholder="The one thing we want the audience to remember."></textarea>
          </div>

          <div class="field">
            <label for="insight">Insight</label>
            <textarea id="insight" name="Insight" placeholder="The brutal truth, cultural tension, or psychological hook."></textarea>
          </div>

          <div class="field">
            <label for="behavior">Behavioral Objective</label>
            <textarea id="behavior" name="Behavioral Objective" placeholder="Move the audience from what current behavior to what desired behavior?"></textarea>
          </div>

          <div class="field">
            <label for="audienceInsight">Audience Insight</label>
            <textarea id="audienceInsight" name="Audience Insight" placeholder="What does the audience believe, feel, need, or resist?"></textarea>
          </div>

          <div class="field">
            <label for="enemy">Who is the Enemy?</label>
            <textarea id="enemy" name="Enemy" placeholder="What frustration, status quo, competitor, or sentiment are we fighting?"></textarea>
          </div>

          <div class="field full">
            <label for="tone">Emotional Hook & Tone</label>
            <textarea id="tone" name="Emotional Hook and Tone" placeholder="How should the audience feel?"></textarea>
          </div>
        </div>
      </section>

      <section class="form-section">
        <h3 class="section-title">Audience & Messaging</h3>
        <div class="grid">
          <div class="field">
            <label for="targetAudienceType">Target Audience *</label>
            <select id="targetAudienceType" name="Target Audience Type" required>
              <option value="">Select an option</option>
              <option>Residential prospects</option>
              <option>Existing residential customers</option>
              <option>Business prospects</option>
              <option>Existing business customers</option>
              <option>Competitive switchers</option>
              <option>Fiber expansion area</option>
              <option>Other</option>
            </select>
          </div>

          <div class="field">
            <label for="objective">Primary Objective *</label>
            <select id="objective" name="Primary Objective" required>
              <option value="">Select an option</option>
              <option>Awareness</option>
              <option>Consideration</option>
              <option>Lead generation</option>
              <option>Sales / conversion</option>
              <option>Retention</option>
              <option>Winback</option>
              <option>Education</option>
            </select>
          </div>

          <div class="field full">
            <label for="targetAudience">Target Audience Details</label>
            <textarea id="targetAudience" name="Target Audience Details" placeholder="Demographics, behavioral details, psychographics, barriers, market info, and media habits."></textarea>
          </div>

          <div class="field full">
            <label for="keyMessaging">Key Messaging</label>
            <textarea id="keyMessaging" name="Key Messaging" placeholder="Provide 2–3 key messages and reasons to believe."></textarea>
          </div>
        </div>
      </section>

      <section class="form-section">
        <h3 class="section-title">Offer</h3>

        <div class="offer-grid">
          <div class="field">
            <label for="offer1">Primary Offer Version 1</label>
            <input id="offer1" name="Primary Offer Version 1" placeholder="Offer">
          </div>
          <div class="field">
            <label for="secondary1">Secondary Push</label>

          </div>

            <label for="cta1">Primary CTA</label>

          </div>
        </div>

        <div class="offer-grid">
          <div class="field">
            <label for="offer2">Primary Offer Version 2</label>
            <input id="offer2" name="Primary Offer Version 2" placeholder="Offer">
          </div>
          <div class="field">
            <label for="secondary2">Secondary Push</label>
            <input id="secondary2" name="Secondary Push 2" placeholder="GC, TechAssist, eero add-on, etc.">
          </div>
          <div class="field">
            <label for="cta2">Primary CTA</label>
            <input id="cta2" name="Primary CTA 2" placeholder="CTA">
          </div>
        </div>

        <div class="offer-grid">
          <div class="field">
            <label for="offer3">Primary Offer Version 3</label>
            <input id="offer3" name="Primary Offer Version 3" placeholder="Offer">
          </div>
          <div class="field">
            <label for="secondary3">Secondary Push</label>
            <input id="secondary3" name="Secondary Push 3" placeholder="GC, TechAssist, eero add-on, etc.">

          <div class="field">

      <section class="form-section">

            <label for="deliverableType">Desired Deliverables *</label>

          <div class="field full">
            <label for="deliverables">Deliverables Detail</label>

          </div>

          <div class="field full">
            <label for="mandatories">Mandatories</label>
            <textarea id="mandatories" name="Mandatories" placeholder="Required logos, legal copy, URLs, phone numbers, market names, specs, or offer details."></textarea>
          </div>

          <div class="field full">
            <label for="additionalNotes">Additional Notes / Details</label>
            <textarea id="additionalNotes" name="Additional Notes / Details" placeholder="Share any additional context, notes, or important details..."></textarea>
          </div>
        </div>

        <div class="upload-row" style="margin-top: 22px;">
          <div class="field">
            <label>Upload Supporting Files <span class="hint">(Optional)</span></label>
            <label class="file-box">
              <input id="supportingFiles" name="Supporting Files" type="file" multiple>
              <svg width="38" height="38" viewBox="0 0 48 48" aria-hidden="true">
                <path d="M15 34H9a8 8 0 0 1 0-16 12 12 0 0 1 23-4 10 10 0 0 1 2 20h-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                <path d="M24 37V21M17 28l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span><strong>Click to upload or drag and drop</strong>PDF, DOC, XLS, JPG, PNG</span>
            </label>
          </div>

          <div class="field">
            <label for="market">Select Market / Region <span class="hint">(Optional)</span></label>
            <select id="market" name="Market / Region">
              <option value="">Select an option</option>
              <option>Idaho Falls</option>
              <option>Rio Rancho</option>
              <option>Sioux City</option>
              <option>SW Oklahoma</option>
              <option>SE Oklahoma</option>
              <option>Central Missouri</option>
              <option>East Texas</option>
              <option>Gulfport / Biloxi-Pascagoula</option>
              <option>Boise</option>
              <option>Other / Multiple Markets</option>
            </select>
          </div>
        </div>
      </section>

      <div class="actions">
        <button type="button" class="primary" onclick="submitBrief()">Submit Brief</button>
        <button type="button" onclick="fillDemoData()">Demo Fill</button>
        <button type="button" onclick="downloadBrief()">Download TXT</button>
        <button type="button" onclick="copyBrief()">Copy Brief</button>
        <button type="button" onclick="emailBrief()">Email Brief</button>
      </div>
    </form>
  </main>

  <footer class="footer">
    <p>* Creative briefs should align messaging, emotional insight, audience behavior, deliverables, legal requirements, and approved Sparklight® positioning before launch.</p>
    <p class="tool-tag">A Problematic Tool.</p>
    <p>© 2026 Sparklight®</p>
  </footer>

</div>

<div id="toast" class="toast">Brief ready.</div>

<script>
const hiddenRecipient = "Farrellt@sparklight.biz";

function getBriefText(){
  const form = document.getElementById("briefForm");
  const data = new FormData(form);

  let output = "YE OLE CREATIVE BRIEF COMPILER\\n";
  output += "==========================\\n\\n";

  for (const [key, value] of data.entries()){
    if (key === "Supporting Files") continue;
    output += key.toUpperCase() + ":\\n";
    output += (value || "[Not provided]") + "\\n\\n";
  }

  const files = document.getElementById("supportingFiles").files;
  if (files.length){
    output += "SUPPORTING FILES:\\n";
    Array.from(files).forEach(file => output += "- " + file.name + "\\n");
    output += "\\n";
  }

  output += "© 2026 Sparklight®";
  return output;
}

function validateBrief(){
  const form = document.getElementById("briefForm");
  if (!form.checkValidity()){
    form.reportValidity();
    return false;
  }
  return true;
}

function showToast(message){
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2200);
}

function downloadBrief(){
  if (!validateBrief()) return;

  const blob = new Blob([getBriefText()], {type:"text/plain;charset=utf-8"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "ye_ole_creative_brief.txt";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(link.href);

  showToast("Brief downloaded.");
}

async function copyBrief(){
  if (!validateBrief()) return;

  await navigator.clipboard.writeText(getBriefText());
  showToast("Brief copied.");
}

function emailBrief(){
  if (!validateBrief()) return;

  const subject = encodeURIComponent("Creative Brief Submission");
  const body = encodeURIComponent(getBriefText());
  window.location.href = `mailto:${hiddenRecipient}?subject=${subject}&body=${body}`;
}

function submitBrief(){
  emailBrief();
}
</script>
